# =============================================================================
# ci.yml — Continuous Integration: the quality gate
# =============================================================================
# Runs on EVERY push to any branch and EVERY pull request.
# If any step fails → the check is RED → the developer must fix it before merging.
# This is how broken code gets caught BEFORE it reaches production.
#
# Two independent jobs (they run in parallel):
#   1. backend  — compile + test the Spring Boot app (./mvnw verify)
#   2. frontend — lint + build the React app (npm run lint + npm run build)
# =============================================================================

name: CI

# When does this run? On push to any branch, and on all pull requests.
on:
  push:
  pull_request:

jobs:
  # =========================================================================
  # JOB 1: BACKEND — compile + test
  # =========================================================================
  backend:
    name: Backend (Java 17)
    runs-on: ubuntu-latest
    steps:
      # Download the code from the repo
      - name: Checkout code
        uses: actions/checkout@v4

      # Install Java 17 (Temurin = the OpenJDK build we already use)
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'  # caches Maven deps between runs → faster CI

      # The Maven wrapper file (mvnw) needs the executable bit on Linux.
      # On Windows it's committed without it, so we set it explicitly.
      - name: Make wrapper executable
        working-directory: backend/nexus-backend
        run: chmod +x mvnw

      # verify = compile + run tests + package. This is the full quality gate.
      - name: Build and test
        working-directory: backend/nexus-backend
        run: ./mvnw -B verify

  # =========================================================================
  # JOB 2: FRONTEND — lint + build
  # =========================================================================
  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Install Node.js 20 and cache npm deps for speed
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/nexus-frontend/package-lock.json

      # npm ci = clean install using exact versions from the lock file
      - name: Install dependencies
        working-directory: frontend/nexus-frontend
        run: npm ci

      # ESLint checks code style + catches bugs (unused vars, bad patterns)
      - name: Lint
        working-directory: frontend/nexus-frontend
        run: npm run lint

      # vite build = produces the production bundle. Catches syntax/import errors.
      # Note: VITE_* env vars aren't set here, so the bundle has empty URLs —
      # that's fine, CI only checks that the code COMPILES.
      - name: Build
        working-directory: frontend/nexus-frontend
        run: npm run build
