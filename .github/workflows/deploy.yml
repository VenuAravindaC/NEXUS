# =============================================================================
# deploy.yml — Deploy to production on every push to main
# =============================================================================
# Pipeline: push to main → build images → push to GHCR → trigger Render deploy
#
# Why push to GHCR (GitHub Container Registry)?
#   GHCR is GitHub's free Docker registry. It stores our built images so that
#   Render (or any server) can pull exactly the image we tested — never
#   "whatever happens to be on the server."
#
# Why not build on Render directly?
#   Building in CI gives one source of truth: one build, reused everywhere.
#   It also teaches the standard "registry" flow used by real companies.
#
# What about Vercel (frontend)?
#   Vercel has its own native GitHub integration — connect the repo in the
#   Vercel dashboard and it auto-deploys on push to main. No GitHub Action
#   needed for Vercel. The frontend Docker image we build here is used by
#   Render if you choose to host the frontend there too, and for local
#   docker-compose testing.
# =============================================================================

name: Deploy

# Only run when code lands on the main branch
on:
  push:
    branches: [main]

jobs:
  build-and-push:
    name: Build images + push to GHCR + deploy
    runs-on: ubuntu-latest

    # These permissions let the workflow WRITE to the container registry.
    # GitHub gives every workflow a special token (GITHUB_TOKEN) — this grants
    # it the "packages: write" permission it needs to push Docker images.
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Log in to GHCR using the automatic GITHUB_TOKEN (no password to manage)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}          # whoever triggered the run
          password: ${{ secrets.GITHUB_TOKEN }}  # auto-provided by GitHub

      # ---------------------------------------------------------------
      # BACKEND image
      # ---------------------------------------------------------------
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend/nexus-backend
          file: backend/nexus-backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}-backend:latest

      # ---------------------------------------------------------------
      # FRONTEND image
      # ---------------------------------------------------------------
      # Requires build args — Vite bakes these into the JS bundle at build time.
      # The values come from GitHub repository secrets (Settings → Secrets).
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend/nexus-frontend
          file: frontend/nexus-frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}-frontend:latest
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_CLERK_PUBLISHABLE_KEY=${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
            VITE_VAPID_PUBLIC_KEY=${{ secrets.VITE_VAPID_PUBLIC_KEY }}

      # ---------------------------------------------------------------
      # Trigger Render to redeploy the backend
      # ---------------------------------------------------------------
      # Render gives you a Deploy Hook URL (a secret web address). Hitting it
      # with curl tells Render "a new image is ready, deploy it."
      # You create this URL in the Render dashboard for your backend service.
      - name: Trigger Render deploy
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
