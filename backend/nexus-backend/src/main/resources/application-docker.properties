# =============================================================================
# application-docker.properties — Production overrides for Docker deployment
# =============================================================================
# Activated by SPRING_PROFILES_ACTIVE=docker (set in Dockerfile)
# Overrides the defaults in application.properties for production safety.
# =============================================================================

# SECURITY: NEVER auto-modify schema in production.
# "validate" = Hibernate checks that tables/columns match your entities, but
# won't CREATE or ALTER anything. If schema drifts → fail-fast instead of
# silently corrupting data. Use Flyway/Liquibase for schema migrations.
spring.jpa.hibernate.ddl-auto=validate

# SECURITY: Don't log SQL queries in production — exposes data in logs
spring.jpa.show-sql=false

# Explicit port (matches Dockerfile EXPOSE 8080)
server.port=8080

# CORS: read from environment variable (comma-separated origins)
# In docker-compose or Render, set: CORS_ALLOWED_ORIGINS=https://your-frontend.vercel.app
# Fallback to * (all origins) if not set — override in production!
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}