spring.application.name=nexus-backend
# Database Connection
# Credentials are kept OUT of the URL (avoids JDBC URL-parse ambiguity with
# special characters in passwords). The URL is just host/db; username and
# password come from separate env vars. NEVER hardcode credentials in this file.
# Local example:
#   DATABASE_URL="jdbc:postgresql://host:5432/db?sslmode=require"
#   DB_USERNAME="user"
#   DB_PASSWORD="pass"
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Clerk JWT verification — the backend auth lock.
# CLERK_JWKS_URL = Clerk's public signing-keys endpoint:
#   e.g. https://sharp-midge-68.clerk.accounts.dev/.well-known/jwks.json
# The value is REQUIRED: ClerkJwtVerifier fails startup if it's missing, so the
# /api endpoints can NEVER accidentally run unauthenticated (fail closed).
clerk.jwks-url=${CLERK_JWKS_URL}
