spring.application.name=nexus-backend
# Database Connection
# The full JDBC URL (with embedded user:password) comes from the DATABASE_URL
# environment variable. NEVER hardcode credentials in this file.
# Local example:
#   DATABASE_URL="jdbc:postgresql://user:pass@host/db?sslmode=require"
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
