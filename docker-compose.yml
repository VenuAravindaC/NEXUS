# =============================================================================
# docker-compose.yml — Run the full NEXUS stack locally with one command
# =============================================================================
# Usage: docker-compose up --build
#   Frontend → http://localhost:5173
#   Backend  → http://localhost:8080
#   Postgres → localhost:5432
#
# Why docker-compose for local dev?
#   1. Tests that all containers work together BEFORE deploying
#   2. Simulates production (nginx serves frontend, not Vite dev server)
#   3. Fresh database — no conflicts with your local Postgres
#   4. One command to start everything: docker-compose up --build
#
# Stop everything: Ctrl+C (or docker-compose down)
# Remove all data: docker-compose down -v (deletes the database volume)
# =============================================================================

services:
  # =========================================================================
  # POSTGRESQL — Database
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: nexus-db
    ports:
      - "5432:5432"  # Expose to host so you can also connect with pgAdmin/DBeaver
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
    volumes:
      - pgdata:/var/lib/postgresql/data  # Persist data between restarts

  # =========================================================================
  # BACKEND — Spring Boot API
  # =========================================================================
  backend:
    build:
      context: ./backend/nexus-backend
      dockerfile: Dockerfile
    container_name: nexus-backend
    ports:
      - "8080:8080"
    depends_on:
      - postgres  # Start DB first (backend will retry connection)
    environment:
      # --- Database (points to the postgres container above) ---
      DATABASE_URL: jdbc:postgresql://postgres:5432/nexus
      DB_USERNAME: nexus
      DB_PASSWORD: nexus

      # --- VAPID Keys (for push notifications) ---
      # Copy from your backend/.env or generate fresh keys
      # Generate: npx web-push generate-vapid-keys
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}

      # --- Clerk (for authentication) ---
      # Use your backend/.env value here
      CLERK_JWKS_URL: ${CLERK_JWKS_URL}

      # --- CORS ---
      # In docker-compose, the frontend is served by nginx on port 5173
      # The browser sends requests from localhost:5173 → backend:8080
      CORS_ALLOWED_ORIGINS: http://localhost:5173

      # --- Spring profile ---
      SPRING_PROFILES_ACTIVE: docker

      # --- Schema setup (LOCAL ONLY) ---
      # The compose Postgres starts EMPTY. The docker profile sets
      # ddl-auto=validate (Hibernate just checks, never creates) — correct
      # for production, but it crashes on an empty DB.
      #
      # Spring precedence: env vars BEAT properties files. So this env var
      # overrides the properties file here (LOCAL), while production Render
      # still gets `validate` from application-docker.properties.
      #
      # update = Hibernate creates/updates tables automatically (dev behavior)
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

  # =========================================================================
  # FRONTEND — React SPA served by nginx
  # =========================================================================
  frontend:
    build:
      context: ./frontend/nexus-frontend
      dockerfile: Dockerfile
      args:
        # Vite bakes these into the JS bundle at build time.
        # The browser (not the container) uses these values.
        #
        # Why http://localhost:8080? The user's BROWSER makes API requests,
        # not the nginx container. So the URL must be reachable from the host.
        VITE_API_URL: http://localhost:8080
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
        VITE_VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
    container_name: nexus-frontend
    ports:
      - "5173:80"  # nginx serves on 80, we map to 5173 to match dev convention
    depends_on:
      - backend

# Named volumes — persist database data between docker-compose restarts
volumes:
  pgdata:
