# =============================================================================
# nginx.conf — Nginx configuration for serving the React SPA
# =============================================================================
# This file is copied to /etc/nginx/conf.d/default.conf in the Docker image.
# It replaces nginx's default config which doesn't know about SPA routing.
# =============================================================================

server {
    listen 80;
    server_name _;  # _ = catch-all, responds to any hostname

    # Where nginx looks for files (the dist/ folder we copied in Dockerfile)
    root /usr/share/nginx/html;
    index index.html;

    # ---------------------------------------------------------------
    # GZIP COMPRESSION
    # ---------------------------------------------------------------
    # Compress responses on-the-fly. Reduces transfer size by ~70% for
    # text-based files (HTML, CSS, JS, JSON, SVG).
    # Browser receives smaller files → faster page loads.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 256;  # Don't bother compressing tiny responses

    # ---------------------------------------------------------------
    # CACHE HEADERS FOR STATIC ASSETS
    # ---------------------------------------------------------------
    # Vite names built files with hashes: index-abc123.js, style-def456.css
    # Since the hash changes on every code change, we can cache aggressively —
    # a new filename means a new file, so stale caches won't stick around.
    location /assets/ {
        expires 1y;               # Cache for 1 year
        add_header Cache-Control "public, immutable";  # "immutable" = don't revalidate
    }

    # ---------------------------------------------------------------
    # SERVICE WORKER — must be served from root scope
    # ---------------------------------------------------------------
    # The service worker (sw.js) MUST be at the root (/sw.js), not in /assets/.
    # Why? Service workers can only control pages at their scope or below.
    # If sw.js were in /assets/, it could only control /assets/* pages — not the app.
    # Vite PWA plugin outputs sw.js to the root of dist/, so nginx serves it naturally.

    # ---------------------------------------------------------------
    # SPA FALLBACK — the most important line in this file
    # ---------------------------------------------------------------
    # React Router uses "history mode" (BrowserRouter). When a user navigates to
    # /reminders/123, the browser asks nginx for /reminders/123.
    #
    # Without this rule, nginx would return 404 ("file not found") because
    # there's no actual file at /reminders/123 — only at /index.html.
    #
    # try_files $uri $uri/ /index.html means:
    #   1. Try the exact file ($uri) — works for /assets/index-abc.js, /sw.js
    #   2. Try as directory ($uri/) — works for /assets/
    #   3. Fall back to /index.html — React Router takes over and renders the right page
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------------------------------------------------------------
    # SECURITY HEADERS
    # ---------------------------------------------------------------
    # Prevent nginx from exposing server version in headers
    server_tokens off;

    # Clickjacking protection — don't let other sites embed this in an iframe
    add_header X-Frame-Options "SAMEORIGIN" always;

    # MIME type sniffing protection — browser must respect Content-Type header
    add_header X-Content-Type-Options "nosniff" always;
}
