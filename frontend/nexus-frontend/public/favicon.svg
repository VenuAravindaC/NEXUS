<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- CUE ping mark: radar pulse on dark rounded square.
       Rendered in the browser tab at 16–32px — thick strokes, no detail. -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#1a1a1a"/>

  <!-- Source dot (center) -->
  <circle cx="32" cy="32" r="5.5" fill="white"/>

  <!-- Visible arcs: long arc (large-arc=1, sweep=0 = counterclockwise =
       upward through the top). Start/end angles = 90° ± 29° (the gap is
       at the bottom; arcs span the rest).

       Inner arc (r=11):
         θ₁ = 118.6° → (26.7, 41.7)   θ₂ = 61.4°  → (37.3, 41.7)
       Mid arc (r=18):
         θ₁ = 118.6° → (23.4, 47.8)   θ₂ = 61.4°  → (40.6, 47.8)
       Outer arc (r=25):
         θ₁ = 118.6° → (20.0, 54.0)   θ₂ = 61.4°  → (44.0, 54.0)
  -->
  <path d="M 26.7 41.7 A 11 11 0 1 0 37.3 41.7"
        fill="none" stroke="white" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M 23.4 47.8 A 18 18 0 1 0 40.6 47.8"
        fill="none" stroke="white" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M 20.0 54.0 A 25 25 0 1 0 44.0 54.0"
        fill="none" stroke="white" stroke-width="2.8" stroke-linecap="round"/>
</svg>
